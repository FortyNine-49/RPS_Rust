# Example: one OS thread per client connection.
worker_processes 2;
daemon off;
pid run_pid.conf;

event {
    use multithreading;
    worker_connections 1024;
}

http {
    upstream backend {
        server 127.0.0.1:8080;
        server 127.0.0.1:8081;
        keepalive 16;
        keepalive_timeout 60s;
    }

    server {
        listen 8000;
        server_name "localhost";

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
    }
}
